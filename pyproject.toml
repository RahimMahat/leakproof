[project]
name = "leakproof"
version = "0.1.0"
description = "Real-time fraud detection that measures its own data leakage."
readme = "README.md"
authors = [
    { name = "RahimMahat", email = "rahimmahat99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "kagglehub>=1.0.2",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.65.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
leakproof = "leakproof.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["leakproof", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
