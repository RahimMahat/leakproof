# Local infrastructure: Redpanda (Kafka-compatible broker) and Redis (online feature store).
#   docker compose up -d      start
#   docker compose ps         both should be "healthy"
#   docker compose down -v    stop and delete data
services:
  redpanda:
    image: redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=localhost:9092   # clients run on the host, not in the compose network
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redpanda-data:
